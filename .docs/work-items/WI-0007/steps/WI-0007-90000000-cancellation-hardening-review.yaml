        statement: CANCELLED uses a dedicated error phase consistently across types, response schema, implementation, tests, and documentation.
        purpose: Prevent cancellation from being routed as retry or ordinary provider failure.
        required: true
        evidenceRefs: [WI-0007|00000000#result/OUT-003, WI-0007|80000000#result/R-001]
      - id: CRIT-004
        statement: The follow-up remains additive to v2 and does not modify v1, WI-0006, LangGraph/deployment scope, or unrelated request-schema work.
