  result:
    summary: A bounded hardening design for cancellation races, explicit cancellation lifecycle events, and a dedicated cancellation diagnostic phase.
    model:
      name: wi-0007-cancellation-hardening
      kind: process
      description: v2 completion cancellation control and monitor event lifecycle.
    elements:
      - id: E-001
        type: boundary
        name: post-provider-response-check
        description: AbortSignal is checked after llm.provider.response emission and before terminal output handling.
        provenance: {referenceRefs: [REF-001, REF-002, REF-006], basis: Closes the monitor-triggered success race., confidence: 98}
      - id: E-002
        type: boundary
        name: pre-tool-invocation-check
        description: Each parallel tool callback checks cancellation after its lifecycle event and before invoking the tool.
        provenance: {referenceRefs: [REF-001, REF-002, REF-006], basis: Prevents later unstarted tools from crossing the side-effect boundary., confidence: 96}
      - id: E-003
