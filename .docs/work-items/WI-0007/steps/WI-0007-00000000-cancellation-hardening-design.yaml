    provenance:
      referenceRefs: [REF-001, REF-002, REF-003, REF-004, REF-005, REF-006, REF-007]
      basis: The hardening design is derived from current implementation inspection and the WI-0005 review findings.
      confidence: 95
    considerations:
      - id: C-001
        kind: constraint
        statement: A signal aborted by the provider-response debug event must be observed before terminal response processing.
        evaluation: Accepted; this closes the success-after-cancellation race without changing provider response semantics.
        referenceRefs: [REF-001, REF-002, REF-006]
        status: accepted
        impact: 98
        confidence: 98
      - id: C-002
        kind: constraint
        statement: A parallel tool call must not cross its invocation boundary after cancellation is observed.
        evaluation: Accepted; already-started tools may settle cooperatively, while later unstarted calls must not execute.
        referenceRefs: [REF-001, REF-002, REF-006]
        status: accepted
        impact: 98
        confidence: 96
      - id: C-003
        kind: decision
        statement: Cancellation lifecycle events use the existing DebugSink and occur before the terminal llm.response event.
        evaluation: Accepted; no second observer API is introduced.
        referenceRefs: [REF-001, REF-003, REF-007]
        status: accepted
        impact: 94
        confidence: 96
      - id: C-004
        kind: decision
        statement: CANCELLED diagnostics use a dedicated cancellation error phase rather than retry.
        evaluation: Accepted; cancellation is a distinct terminal control outcome.
        referenceRefs: [REF-001, REF-004, REF-005]
        status: accepted
        impact: 90
        confidence: 94
    activities:
      - id: ACT-001
        type: analysis
        summary: Inspect current cancellation checkpoints, tool Promise.all scheduling, DebugSink events, response schema, tests, and WI-0005 evidence.
        status: completed
        referenceRefs: [REF-002, REF-003, REF-004, REF-005, REF-006, REF-007]
        provenance:
