  intent:
    summary: Define additive v2 cancellation race hardening and explicit lifecycle events on the existing DebugSink/AbortSignal boundaries.
    objectives:
      - Define the cancellation check after llm.provider.response and before terminal output processing.
      - Define the pre-invocation boundary for parallel tool calls after llm.tool.call cancellation.
      - Define llm.cancel.observed and llm.cancelled event ordering, payload bounds, and phase metadata.
      - Define a dedicated cancellation error phase and focused regression/test/scope obligations.
    inScope:
      - src/complete.ts cancellation checkpoints and parallel tool invocation boundary.
      - src/debug.ts event delivery through existing DebugSink sanitization.
      - src/types.ts and response/v2 schema cancellation phase/status contract.
      - deterministic tests and SKILL.md documentation.
    outOfScope:
      - New observer APIs, request callbacks, v1 changes, LangGraph, persistence, resume, rollback, or forced tool termination.
      - WI-0006 samples and unrelated request-schema worktree changes.
