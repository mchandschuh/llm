      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0025-80000000#result/R-001
    - id: WI-0025-90000000_FIND-002
      severity: advisory
      status: resolved
      message: "The ParameterValidationFailure summary dropped the remaining-issue count when the first message was long, contradicting the documented summary."
      requestedChange: "Fixed in dbbe9ea: the first issue is truncated instead of the count."
      criterionRefs:
      - '#criterion/CRIT-003'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0025-80000000#result/R-001
    - id: WI-0025-90000000_FIND-003
      severity: advisory
      status: resolved
      message: "Whitespace-only or control-only message, remediation, or metadata text passed the non-empty check and became the placeholder text \"The operation failed.\""
      requestedChange: "Fixed in dbbe9ea: blank text is a configuration error in results, metadata, and string returns."
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0025-80000000#result/R-001
    - id: WI-0025-90000000_FIND-004
      severity: advisory
      status: resolved
      message: "The errors array accepted extra own members, a gap in the closed result shape."
      requestedChange: "Fixed in dbbe9ea: the errors array may hold only its indexes and length."
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0025-80000000#result/R-001
    - id: WI-0025-90000000_FIND-005
      severity: advisory
      status: resolved
      message: "An accessor on an errors index was reported as errors.0 instead of errors[0]."
      requestedChange: "Fixed in dbbe9ea: index accessors use the errors[i] label."
      criterionRefs:
      - '#criterion/CRIT-003'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0025-80000000#result/R-001
    - id: WI-0025-90000000_FIND-006
      severity: advisory
      status: resolved
      message: "Tests did not cover path sanitization, the issue count with long messages, blank text, or index accessors, and a host-side getter regression would hang the test instead of failing it."
      requestedChange: "Fixed in dbbe9ea: assertions were added for each case, and getters now throw a marker that the tests check is absent."
      criterionRefs:
      - '#criterion/CRIT-001'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0025-80000000#result/R-001
