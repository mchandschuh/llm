        - requests/README.md
        - requests/decisions.md
        - README.md
        - SKILL.md
      - id: WI-0025-20000000_CHANGE-005
        type: production-code
        summary: 'Rework for the independent review. Issue paths are now redacted and truncated like messages and remediations. The failure summary keeps the remaining-issue count when the first message is long. Whitespace-only or control-only text is a configuration error, including metadata message and remediation and string returns. The errors array may hold only its indexes and length. Index accessors report errors[i]. Directly constructed ParameterValidationFailure issues are normalized. Getter tests now throw a marker, so a host-side getter call fails instead of hanging.'
