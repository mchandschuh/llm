  result:
    status: defined
    testCases:
    - id: WI-0025-10000000_TC-RESULT-OBJECT-CONTRACT
      title: Accept and reject validation result objects
      type: unit
      requirementLevel: required
      purpose: Prove valid and invalid result objects map to pass or issues, paths default to the concrete path, and malformed, oversized, or accessor-based results are configuration errors that never run getters.
      procedure:
        executionMode: executable
        target: runParameterValidators result handling
        steps:
        - Arrange validators returning valid and malformed result objects.
        - Run validation for each.
        - Assert passes, issues, configuration errors, and that getters never run.
        command: npm test -- --test-name-pattern=WI-0025-10000000_TC-RESULT-OBJECT-CONTRACT
      expectedOutcome: The result-object-contract behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [Provider-free tests do not establish authenticated provider behavior.]
    - id: WI-0025-10000000_TC-STRUCTURED-FAILURE
      title: Raise ParameterValidationFailure with normalized issues
      type: unit
      requirementLevel: required
      purpose: Prove object, false, string, thrown, and rejected-promise failures raise ParameterValidationFailure with path, message, and remediation, keep CONFIGURATION_INVALID and a bounded message, and make zero provider calls.
      procedure:
        executionMode: executable
        target: runParameterValidators and completeRequest
        steps:
        - Arrange validators for each failure form, with and without metadata remediation.
        - Run them directly and through completeRequest with an injected provider.
        - Assert issues, code, message bounds, export, and zero provider calls.
        command: npm test -- --test-name-pattern=WI-0025-10000000_TC-STRUCTURED-FAILURE
      expectedOutcome: The structured-failure behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [Provider-free tests do not establish authenticated provider behavior.]
    - id: WI-0025-10000000_TC-CLI-ERROR-OUTPUT
      title: Emit per-issue CLI errors
      type: component
      requirementLevel: required
      purpose: Prove llm req writes one JSON error entry per issue with parameterPath and remediation, exits 1 with no stdout, and keeps the single-entry shape for other failures.
      procedure:
        executionMode: executable
        target: runRequestCommand
        steps:
        - Arrange a request whose validator returns several issues.
        - Run the request command with an injected provider.
        - Assert stderr entries, exit code, empty stdout, and the unchanged non-validation shape.
        command: npm test -- --test-name-pattern=WI-0025-10000000_TC-CLI-ERROR-OUTPUT
      expectedOutcome: The cli-error-output behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: component
      fixtureRefs: []
      limitations: [Provider-free tests do not establish authenticated provider behavior.]
    - id: WI-0025-10000000_TC-CONTRACT-DOCUMENTATION
      title: Keep the structured-result contract aligned
      type: unit
      requirementLevel: required
      purpose: Prove requests/README.md and public docs name every result member, bound, the failure type, and the CLI error fields.
      procedure:
        executionMode: executable
        target: requests/README.md and public docs
        steps:
        - Read the contract and public docs.
        - Compare documented names and bounds with implementation constants.
        - Assert every required statement is present.
        command: npm test -- --test-name-pattern=WI-0025-10000000_TC-CONTRACT-DOCUMENTATION
      expectedOutcome: The contract-documentation behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [Provider-free tests do not establish authenticated provider behavior.]
    fixtures: []
