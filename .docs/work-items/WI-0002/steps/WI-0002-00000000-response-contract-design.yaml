  intent:
    summary: Define the public response/v2 contract for exposing bounded executed tool results.
    objectives:
      - Make executed tool results available through the public LlmResponseV2 type and response/v2 schema.
      - Preserve deterministic result ordering across automatic tool rounds and distinguish executed results from pending calls.
      - Preserve v1 compatibility, bounded response validation, and sanitized tool-error behavior.
    inScope:
      - LlmResponseV2 and the response/v2 JSON Schema.
      - Existing ToolResult records produced by the bounded automatic orchestration path.
      - Result accumulation, response construction, schema validation, and provider-free regression tests.
    outOfScope:
      - Changes to request/v1 or response/v1.
      - New provider wire formats, new tool invocation policy, persistence, or real external tool execution.
      - Authenticated provider, deployment, downstream integration, or production-readiness claims.
    policy:
      id: component-design
      version: "1"
    profile: implementable
    scope: component
    facets:
      - structure
      - behavior
      - contract
      - policy
