        description: Existing deterministic v2 tool-calling evidence.
    provenance:
      referenceRefs:
        - REF-001
        - REF-002
        - REF-003
        - REF-004
        - REF-005
        - REF-006
      basis: The design follows the prepared implementation change and the existing v2 tool-result transport boundary while keeping v1 closed contracts unchanged.
      confidence: 98
    considerations:
      - id: C-001
        kind: boundary
        statement: The public response must expose completed results without exposing provider-specific wire messages.
        evaluation: Reuse normalized ToolResult entries at the response envelope and retain provider mapping inside the adapter boundary.
        referenceRefs:
          - REF-001
          - REF-002
          - REF-003
        status: accepted
        impact: 98
        confidence: 98
      - id: C-002
        kind: constraint
        statement: A response path that executes no tools must not imply that pending calls were executed.
        evaluation: Return an empty toolResults collection for pending, rejected, configuration, and no-tool paths.
        referenceRefs:
          - REF-001
          - REF-003
        status: accepted
        impact: 95
        confidence: 98
      - id: C-003
        kind: risk
        statement: Tool result history could grow without bound or leak invocation secrets through errors.
        evaluation: Bound the response collection and preserve existing boundedMessage sanitization for invocation failures.
        referenceRefs:
          - REF-001
          - REF-003
          - REF-005
        status: accepted
        impact: 100
        confidence: 98
    activities:
      - id: ACT-001
