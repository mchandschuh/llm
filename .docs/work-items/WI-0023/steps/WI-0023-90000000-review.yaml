      - WI-0023-80000000#result/R-001
      findingRefs:
      - '#finding/WI-0023-90000000_FIND-001'
      - '#finding/WI-0023-90000000_FIND-002'
      - '#finding/WI-0023-90000000_FIND-009'
    - criterionRef: '#criterion/CRIT-003'
      status: satisfied
      summary: requests/README.md, README.md, and SKILL.md state that request bundles are trusted code and that node:vm isolation is not a security boundary. They also document the Node promise-job timeout limitation. No sandbox, provider, or production claim is made.
      evidenceRefs:
      - WI-0023-80000000#result/R-001
      findingRefs:
      - '#finding/WI-0023-90000000_FIND-005'
      - '#finding/WI-0023-90000000_FIND-008'
    findings:
    - id: WI-0023-90000000_FIND-001
      severity: required
      status: resolved
      message: 'A promise rejected inside a validator (stray Promise.reject, or an async validator that throws) surfaced as an unhandled rejection after validation returned and terminated the process.'
      requestedChange: 'Fixed in 1913817: promises created during a validator run are captured with v8 promiseHooks and handled, and their rejections become bounded validation failures.'
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-002
      severity: required
      status: resolved
      message: 'Validation metadata under contains, propertyNames, dependencies, additionalItems, unevaluatedProperties/Items, or tuple-form items was silently ignored instead of failing closed.'
      requestedChange: 'Fixed in 1913817: every draft-07 and 2020-12 subschema keyword is walked and rejects validation metadata.'
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-003
      severity: advisory
      status: resolved
      message: 'Compile-stage errors from the vm realm lost their message because of an instanceof Error check, and a compile-stage timeout was reported as a generic evaluation error.'
      requestedChange: 'Fixed in 1913817: messages and the timeout code are read through own data properties.'
      criterionRefs:
      - '#criterion/CRIT-001'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-004
      severity: advisory
      status: resolved
      message: 'A class expression passed the function check and then failed at call time as a value validation failure instead of a metadata error.'
      requestedChange: 'Fixed in 1913817: class expressions are rejected at compile time.'
      criterionRefs:
      - '#criterion/CRIT-001'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-005
      severity: advisory
      status: resolved
      message: 'Host-side inspection of returned or thrown objects (then/message getters) ran validator code outside the timeout.'
      requestedChange: 'Fixed in 1913817: results are classified without reading properties, and thrown messages are read only from own data properties.'
      criterionRefs:
      - '#criterion/CRIT-003'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-006
      severity: advisory
      status: resolved
      message: 'Reported paths were ambiguous for property names containing dots or brackets.'
      requestedChange: 'Fixed in 1913817: non-identifier property names are bracket-quoted as ["name"].'
      criterionRefs:
      - '#criterion/CRIT-001'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-007
      severity: advisory
      status: resolved
      message: 'Tests did not cover rejecting async validators, the newly rejected positions, or the promise-job timeout.'
      requestedChange: 'Fixed in 1913817: assertions were added to TC-METADATA-CONTRACT and TC-RESULT-SEMANTICS; the promise-job timeout is checked in a child process.'
      criterionRefs:
      - '#criterion/CRIT-001'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-008
      severity: advisory
      status: waived
      message: 'Node v24.21.0 aborts natively (InternalCallbackScope assertion) when a vm timeout fires inside a promise job while async-context tracking is active, for example under node:test. This happens even without promise hooks, so it is a Node limitation rather than an llm defect. The CLI is unaffected.'
      requestedChange: 'None in llm; documented in requests/README.md. Revisit if Node fixes vm timeouts under async-context tracking.'
      criterionRefs:
      - '#criterion/CRIT-003'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
    - id: WI-0023-90000000_FIND-009
      severity: advisory
      status: waived
      message: 'Validators inside schemas reached only through an external $ref are not discovered.'
      requestedChange: 'None; documented in requests/README.md. Authors must declare validators in the parameter schema itself.'
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/request-parameter-validation.ts
      evidenceRefs:
      - WI-0023-80000000#result/R-001
