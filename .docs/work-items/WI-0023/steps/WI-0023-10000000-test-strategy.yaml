    - id: WI-0023-10000000_TC-RESULT-SEMANTICS
      title: Map validator results to outcomes
      type: unit
      requirementLevel: required
      purpose: Prove true/undefined pass; false, strings, and thrown errors fail with the documented messages; other results and thenables are configuration errors; infinite loops time out; code generation and Node globals are unavailable.
      procedure:
