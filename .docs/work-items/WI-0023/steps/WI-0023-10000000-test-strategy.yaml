    - id: WI-0023-10000000_TC-METADATA-CONTRACT
      title: Validate x-llm-req-parameter.validation metadata
      type: unit
      requirementLevel: required
      purpose: Prove valid function metadata is accepted alone and with file metadata, and that unknown members, non-string sources, syntax errors, non-function expressions, and unsupported positions fail before provider use.
      procedure:
        executionMode: executable
        target: Parameter-validation metadata discovery and constructRequestParameters
        steps:
        - Arrange valid and malformed validation metadata fixtures.
        - Construct parameters and run completeRequest with an injected provider.
        - Assert CONFIGURATION_INVALID failures and zero provider calls for malformed metadata.
        command: npm test -- --test-name-pattern=WI-0023-10000000_TC-METADATA-CONTRACT
      expectedOutcome: The metadata-contract behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [Provider-free tests do not establish authenticated provider behavior or sandbox security.]
    - id: WI-0023-10000000_TC-INVOCATION-CONTEXT
      title: Invoke validators with a sufficient frozen context
      type: unit
      requirementLevel: required
      purpose: Prove validators receive the documented value and context fields, run per array element with concrete paths in declaration order, skip absent values, and cannot mutate the resolved parameters.
      procedure:
        executionMode: executable
        target: runParameterValidators
        steps:
        - Arrange root, property, nested, and array-item validators that record their context.
        - Run validation over resolved parameters.
        - Assert context fields, ordering, immutability, and skipped absent values.
        command: npm test -- --test-name-pattern=WI-0023-10000000_TC-INVOCATION-CONTEXT
      expectedOutcome: The invocation-context behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [Provider-free tests do not establish authenticated provider behavior or sandbox security.]
    - id: WI-0023-10000000_TC-FILESYSTEM-HELPERS
      title: Expose read-only filesystem helpers
      type: unit
      requirementLevel: required
      purpose: Prove context.fs resolve, exists, isFile, isDirectory, and readText resolve from the working directory and bound text reads.
      procedure:
        executionMode: executable
        target: Validation context filesystem helpers
        steps:
        - Arrange files, directories, and an oversized file.
        - Call each helper from a validator.
        - Assert results, relative resolution, and the bounded readText failure.
        command: npm test -- --test-name-pattern=WI-0023-10000000_TC-FILESYSTEM-HELPERS
      expectedOutcome: The filesystem-helpers behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
