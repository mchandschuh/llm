  result:
    status: defined
    testCases:
    - id: WI-0027-10000000_TC-SCHEMA-DIALECT
      title: Strip $schema dialect declarations from --json-schema
      type: component
      requirementLevel: required
      purpose: Prove that every --json-schema the provider emits (object roots, wrapped roots, tool envelopes, and $id-scoped embedded schemas) contains no $schema keyword, that a property named $schema is preserved, that the emitted schema still compiles with strict Ajv 2020 and accepts and rejects the same values, and that the bundled summarize outputSchema is emitted without $schema.
      procedure:
        executionMode: executable
        target: ClaudeProvider with a fake claude executable
        steps:
        - Arrange object-root, non-object-root, tool, and $id-scoped schemas that declare $schema, plus a property named $schema.
        - Run provider completions and capture the --json-schema argument.
        - Assert no $schema keyword remains, property names are preserved, and validation behavior is unchanged.
        command: npm test -- --test-name-pattern=WI-0027-10000000_TC-SCHEMA-DIALECT
      expectedOutcome: The schema-dialect behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: component
      fixtureRefs: []
      limitations: [A fake claude executable does not establish real Claude Code, authentication, or model behavior.]
    - id: WI-0027-10000000_TC-LIVE-SUITE-WIRING
      title: Keep the live claude suite opt-in
      type: unit
      requirementLevel: required
      purpose: Prove the live suite exists with text, structured-output, CLI summarize, and read_file/write_file chat-session checks; that it runs only through npm run test:live:claude; that npm test does not include it; and that the docs describe it.
      procedure:
        executionMode: executable
        target: package.json scripts, the live suite file, and docs
        steps:
        - Read package.json, the live suite, README.md, and SKILL.md.
        - Assert the script wiring, the presence of each live check, and the documentation.
        - Assert the npm test glob does not match the live suite.
        command: npm test -- --test-name-pattern=WI-0027-10000000_TC-LIVE-SUITE-WIRING
      expectedOutcome: The live-suite-wiring behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [A fake claude executable does not establish real Claude Code, authentication, or model behavior.]
    fixtures: []
    coverage:
