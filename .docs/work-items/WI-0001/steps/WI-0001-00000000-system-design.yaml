  intent:
    summary: Define the public request, provider, invocation, and response
      boundaries for bounded tool calling while preserving v1.
    objectives:
      - Separate v1 compatibility from v2 tool-capable contracts.
      - Define parallel tool call batch semantics and sequential batch ordering.
      - Define validation-before-invoke behavior, including zero execution on
        tool-round-limit violation.
      - Define provider normalization, tool result handling, bounds, errors, and
        evidence obligations.
    inScope:
      - Versioned v2 request and response contracts.
      - Tool definition, tool call, parallel tool call batch, tool_calls, and
        tool result schemas.
      - OpenRouter transport mapping.
      - Injected ToolInvoker and bounded orchestration.
      - Provider-free tests and review evidence.
    outOfScope:
      - v1 schema mutation.
      - Vector or Cline integration.
      - Shell or arbitrary module execution.
      - Live provider calls.
      - Production deployment.
