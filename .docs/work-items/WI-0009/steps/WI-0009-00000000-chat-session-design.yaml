    considerations:
      - id: C-001
        kind: boundary
        statement: chatFactory.createSession creates the per-chat ownership boundary, exposes LlmChatSession, and may wrap the raw LlmProvider without making the raw provider own cross-turn session history.
        evaluation: Define session state and history ownership in LlmChatSession, expose factory creation, and pass complete messages to the provider on every round.
        referenceRefs:
          - REF-001
          - REF-002
          - REF-003
        status: accepted
        impact: 100
        confidence: 96
      - id: C-002
        kind: constraint
        statement: task and taskSchema remain separate initial context fields while LlmRequest.messages and ProviderCompletionRequest.messages represent the canonical ordered conversation history at their respective boundaries.
        evaluation: Specify how initial task context becomes the initial user message/XML prompt and how session history populates both public request messages and raw provider messages without rewriting task context.
        referenceRefs:
          - REF-001
          - REF-005
          - REF-007
        status: accepted
        impact: 100
        confidence: 96
      - id: C-003
        kind: constraint
        statement: Every assistant tool-call message must precede its matching role=tool messages, and all prior complete message history must be replayed for later rounds.
        evaluation: Model request 2 and request 3 sequences explicitly, validate tool_call_id correlation, and reject or fail closed on malformed history.
        referenceRefs:
          - REF-003
          - REF-004
          - REF-011
          - REF-012
        status: accepted
        impact: 100
        confidence: 99
      - id: C-004
        kind: decision
        statement: UserMessageInterruptsToolRound defaults to false; true allows an additional user turn while pending tools remain active, while false blocks or defers that user turn according to an explicit session contract.
        evaluation: Define observable ordering, pending tool ownership, cancellation behavior, and response delivery for both modes without inserting a user message into an incomplete assistant/tool exchange.
        referenceRefs:
          - REF-001
          - REF-003
          - REF-006
        status: accepted
        impact: 100
        confidence: 90
      - id: C-005
        kind: constraint
        statement: LlmChatSession callers must enforce non-concurrency; the session does not add automatic concurrent mutation control.
        evaluation: Document the precondition and test only deterministic serialized usage; identify behavior under violation without implementing a queue or mutex.
        referenceRefs:
          - REF-001
          - REF-009
        status: accepted
        impact: 95
        confidence: 96
      - id: C-006
        kind: boundary
        statement: Compaction and checkpointing are explicit non-goals; session history accumulates and is sent to the provider without reduction or persistence.
        evaluation: Include negative scope checks and ensure no public type, class, option, sample, or design artifact introduces those concepts as implementation behavior.
        referenceRefs:
          - REF-001
        status: accepted
        impact: 100
        confidence: 99
