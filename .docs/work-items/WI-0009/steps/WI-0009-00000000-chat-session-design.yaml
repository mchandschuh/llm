  intent:
    summary: Define the public chatFactory/LlmChatProvider factory facade and LlmChatSession boundary, provider message-history contracts, multi-round tool replay, configurable user-message interruption, OpenRouter HTTP projection, prompt XML schema, executable sample behavior, and implementation verification handoff.
    objectives:
      - Define the chatFactory/LlmChatProvider factory facade, chatFactory.createSession, and LlmChatSession ownership, lifecycle, options, cancellation, EventSink/DebugEvent propagation, and non-concurrency assumptions.
      - Define LlmRequest.messages and ProviderCompletionRequest task/taskSchema/messages separation plus provider-neutral system, user, assistant, and tool message contracts.
      - Define the session state machine that appends assistant tool calls and tool results and replays complete history through request 3 and later rounds.
      - Define additional user-message behavior for UserMessageInterruptsToolRound false and true, including long-running tools and pending work.
      - Define an explicit OpenRouter HTTP projection class/module and adjacent Markdown projection contract.
      - Define schemas/prompt/v1/llm-prompt.xsd, its descriptions, representative fixtures, and schema-validation evidence.
      - Define three provider-free executable samples and deterministic tests that prove ordinary chat, interruptible tools, and blocked tools.
      - Define TypeScript formatting/coding conventions, implementation paths, non-goals, and complete validation gates for the implementation handoff.
    inScope:
      - Public chatFactory/LlmChatProvider factory facade and LlmChatSession exports and declaration generation.
      - ChatFactoryCreateSessionOptions including AbortSignal, EventSink/DebugEvent sink, provider pass-through options, and UserMessageInterruptsToolRound default false.
      - LlmRequest task, taskSchema, messages, and initial-context boundaries plus ProviderCompletionRequest task, taskSchema, messages, toolOptions, provider settings, credentials, and signal boundaries.
      - Provider-neutral ordered message types and OpenRouter assistant/tool message projection.
      - Full ordered history replay across two or more tool rounds and later user turns.
      - User-message interrupt and blocked semantics without inserting a user message into an unfinished assistant/tool exchange.
      - OpenRouter projection class/module and schemas/request/v1/request.schema.md documentation.
      - schemas/prompt/v1/llm-prompt.xsd and representative prompt fixtures/validation.
      - Three executable samples, sample discovery assertions, unit/component/provider projection tests, and public documentation.
      - Design artifacts under /home/michael/src/github/llm/.docs/work-items/WI-0009/.
    outOfScope:
      - Context compaction, summarization, truncation, token budgeting, memory reduction, or history pruning.
      - Checkpoint persistence, session restore, durable history stores, replay checkpoints, or checkpoint terminology in the public API.
      - Automatic mutexes, queues, optimistic concurrency, or other concurrent session mutation controls; callers enforce the non-concurrency requirement.
      - Live provider credentials, authenticated tests, real external tool side effects, deployment, downstream integrations, or production-readiness claims.
      - Unrelated provider protocol changes beyond the message-history and projection contract required for this work item.
