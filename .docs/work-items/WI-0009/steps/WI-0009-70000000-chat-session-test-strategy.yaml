      - id: COV-INV-004
        requirementRefs: [REQ-005, REQ-006]
        invariantRefs: [INV-004]
        objectiveRefs: [OBJ-LIFECYCLE, OBJ-SAMPLES-DOCS]
        testCaseRefs: [TC-ADDITIONAL-USER, TC-USER-POLICIES, TC-SAMPLES]
