          result: passed
        - command: npm test
          result: passed
          evidence: 75 tests passed
        - command: npm run build
          result: passed
        - command: node --test --import tsx tests/chat-session-samples.test.ts
          result: passed
          evidence: 3 focused sample tests passed; blocked sample used approximately three seconds of bounded tool time
        - command: node --test --import tsx tests/samples.test.ts
          result: passed
          evidence: all executable samples passed with one JSON line and no stderr
        - command: git diff --check
          result: passed
    limitations:
      - Samples use injected provider/tool doubles and establish local provider-free behavior only; they do not prove authenticated provider, production, deployment, persistence, or external side-effect behavior.
      - The approximately three-second blocked sample is intentionally time-bounded and is not a latency SLA.
      - Independent validation, review, and delivery are handled by dependent tasks.