          summary: Added default-policy sample with a bounded approximately three-second tool proving the user message is blocked and not processed early.
          objectiveRefs: [OBJ-BLOCKED-SAMPLE]
          paths: [samples/chat-blocked-tool-round.mjs]
        - id: CHANGE-DOCUMENTATION
          type: documentation
          summary: Documented session API, message/history semantics, interruption policies, caller-enforced non-concurrency, and non-goals.
          objectiveRefs: [OBJ-DOCUMENTATION]
          paths: [README.md, SKILL.md]
      testImplementations:
        - id: TEST-SAMPLE-POLICIES
          summary: Executes each named sample and asserts ordinary history, interrupt response-only behavior/lifecycle events, blocked default behavior, timing, and no early history mutation.
          paths: [tests/chat-session-samples.test.ts]
        - id: TEST-SAMPLE-PROTOCOL
          summary: Existing discovery harness validates every sample as one JSON line with no stderr.
          paths: [tests/samples.test.ts]
    verification:
      status: passed
      objectiveRefs: [OBJ-CONVERSATION-SAMPLE, OBJ-INTERRUPT-SAMPLE, OBJ-BLOCKED-SAMPLE, OBJ-DOCUMENTATION]
      tests:
