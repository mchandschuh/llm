    considerations:
      - id: C-001
        kind: interface
        statement: One raw LlmProvider.complete overload set must preserve v1/v2 request-to-response correlation.
        evaluation: Use protocol-discriminated provider request types and overloads ordered from specific v2 to broad v1 because v2 extends the v1 transport base.
        referenceRefs:
          - REF-001
          - REF-002
        status: accepted
        impact: 100
        confidence: 99
      - id: C-002
        kind: constraint
        statement: Provider protocol unification must not change terminal LlmResponse/LlmResponseV2 behavior.
        evaluation: Limit the refactor to raw provider request/response transport, orchestration call sites, exports, fixtures, declarations, and documentation.
        referenceRefs:
          - REF-001
          - REF-003
          - REF-004
        status: accepted
        impact: 100
        confidence: 99
      - id: C-003
        kind: risk
        statement: Removing raw v2-specific variants may affect callers that implemented LlmProviderV2 or injected completeV2.
        evaluation: Remove them from canonical exports and tests, document the unified interface, and retain the exported high-level completeV2 function only if it is not a raw provider variant.
        referenceRefs:
