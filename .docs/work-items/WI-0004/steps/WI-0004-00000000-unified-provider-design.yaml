  intent:
    summary: Define one extensible raw LlmProvider.complete interface for v1 and v2 provider transport while preserving public versioned completion contracts.
    objectives:
      - Replace LlmProviderV2.completeV2 with overloaded LlmProvider.complete methods.
      - Add explicit protocol discrimination and correlated provider response types for future versions.
      - Migrate OpenRouterProvider, v2 orchestration, tests, exports, and documentation without behavior changes.
      - Remove raw v2-specific variants while retaining only justified high-level convenience compatibility.
    inScope:
      - ProviderCompletionRequest v1/v2 type modeling and protocol discrimination.
      - LlmProvider overloads and correlated return types.
      - OpenRouterProvider dispatch and completeV2Internal provider invocation.
      - Test fixtures, public exports, generated declarations, and SKILL.md.
    outOfScope:
      - Removing public request/response version schemas or changing terminal response behavior.
      - Changing finish_reason, tool orchestration, retry, or tool-result semantics.
      - Adding a future v3 implementation; only preserve an extensible type shape.
      - Live provider calls, deployment, and real tool side effects.
