  intent:
    summary: Define additive v2 DebugSink tool lifecycle events and cooperative monitor cancellation without placing callbacks in the serializable request schema or embedding LangGraph in llm.
    objectives:
      - Define event names and payloads for tool batch start, tool call, tool result, and batch end.
      - Define AbortSignal observation points and propagation to provider fetches and injected tools.
      - Define cancelled response/error semantics, preservation of completed results, and no-retry behavior.
      - Define redaction, event ordering, debug-sink failure isolation, and v1/non-goal boundaries.
    inScope:
      - Existing DebugSink and stderrDebugSink event delivery.
      - Runtime CompletionOptions signal propagation through v2 provider and tool execution.
      - Additive v2 response cancelled status and bounded cancellation diagnostic.
      - Deterministic tests, package documentation, schema examples, validation, review, and delivery records.
    outOfScope:
      - Request callbacks or executable values in llm/request/v2.
      - A second observer API, streaming protocol, LangGraph dependency, graph runtime, persistence, checkpointing, resume, or interrupt/resume semantics.
      - v1 contract changes, provider expansion, authenticated calls, or real external side effects.
      - Modification or staging of pre-existing request-schema worktree changes.
