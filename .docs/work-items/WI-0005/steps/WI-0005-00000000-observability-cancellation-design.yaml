    provenance:
      referenceRefs: [REF-001, REF-002, REF-003, REF-004, REF-005, REF-006, REF-007, REF-008]
      basis: The design follows the current runtime DebugSink, existing signal option, provider adapter, response schema, and explicit v2 work-item boundaries.
      confidence: 94
    considerations:
      - id: C-001
        kind: constraint
        statement: DebugSink must remain sanitized, bounded, JSONL-compatible, and unable to change completion behavior when its sink throws.
        evaluation: Accepted; tool and cancellation events reuse emitDebug rather than adding another delivery mechanism.
        referenceRefs: [REF-002, REF-008]
        status: accepted
        impact: 95
        confidence: 98
      - id: C-002
        kind: constraint
        statement: The request document remains serializable and does not contain callbacks or monitor objects.
        evaluation: Accepted; monitor control is represented by a runtime AbortSignal in completion options.
        referenceRefs: [REF-001, REF-005]
        status: accepted
        impact: 95
        confidence: 98
      - id: C-003
        kind: constraint
        statement: Cancellation is cooperative and must not be described as rollback or forced termination of arbitrary tools.
        evaluation: Accepted; provider fetches and signal-aware tools can stop, while completed side effects remain external and unrolled back.
        referenceRefs: [REF-001, REF-003, REF-004]
        status: accepted
        impact: 90
        confidence: 96
      - id: C-004
        kind: decision
        statement: Intermediate tool lifecycle visibility is emitted as DebugSink events, while normalized terminal cancellation is returned through response/v2.
        evaluation: Accepted; this separates diagnostic event transport from the terminal response contract without adding a graph runtime.
        referenceRefs: [REF-002, REF-006]
        status: accepted
        impact: 92
        confidence: 94
