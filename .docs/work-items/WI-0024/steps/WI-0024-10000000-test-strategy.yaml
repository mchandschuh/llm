    testCases:
    - id: WI-0024-10000000_TC-METADATA-VALIDATION
      title: Validate schema-declared file metadata
      type: unit
      requirementLevel: required
      purpose: Prove supported path/content metadata is accepted and malformed, unsupported, or executable metadata fails before provider use.
      procedure:
        executionMode: executable
        target: File-binding metadata validator and parameter constructor
        steps:
        - Arrange valid path/content metadata and malformed metadata fixtures.
        - Validate schemas and construct parameters.
        - Assert bounded failures and zero provider calls for invalid cases.
        command: npm test -- --test-name-pattern=WI-0024-10000000_TC-METADATA-VALIDATION
      expectedOutcome: Supported metadata validates and invalid metadata fails closed.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [Provider-free tests do not establish external provider behavior.]
    - id: WI-0024-10000000_TC-MATERIALIZATION-BOUNDARY
      title: Materialize declared path and content files
      type: component
      requirementLevel: required
      purpose: Prove files are ordered, normalized, included in prompt XML, merged with explicit files, and cleaned up.
      procedure:
        executionMode: executable
        target: completeRequest and normalized provider request
        steps:
        - Arrange a generic request with path and content bindings and explicit files.
        - Capture the injected provider request and inspect files and llmPrompt.
        - Assert deterministic order and temporary-resource cleanup on success and failure.
        command: npm test -- --test-name-pattern=WI-0024-10000000_TC-MATERIALIZATION-BOUNDARY
      expectedOutcome: Declared and explicit files reach the existing provider request boundary in contract order and temporary files are removed.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: component
      fixtureRefs: []
      limitations: [The injected provider seam does not establish authenticated HTTP transport.]
    - id: WI-0024-10000000_TC-SHARED-BOUNDARY
      title: Verify shared CLI and library parameter boundary
      type: integration
      requirementLevel: required
      purpose: Prove llm req and completeRequest construct one shared parameter object and do not special-case summarize.
      procedure:
        executionMode: executable
        target: request CLI and completeRequest integration
        steps:
        - Arrange two differently named request bundles with equivalent file metadata.
        - Invoke library and CLI paths using --parameters and --p-* assignments.
        - Assert equivalent files, prompt XML, and bounded errors.
        command: npm test -- --test-name-pattern=WI-0024-10000000_TC-SHARED-BOUNDARY
      expectedOutcome: Request names do not alter file-binding semantics and parameters are constructed once.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: integration
      fixtureRefs: []
      limitations: [Local integration evidence does not establish production deployment behavior.]
    - id: WI-0024-10000000_TC-SUMMARIZE-EXAMPLE
      title: Execute summarize through llm req parameter bindings
      type: cli
      requirementLevel: required
      purpose: Prove summarize path/content fields use --p-path/--p-content and ordinary JSON Schema rejects neither/both sources.
      procedure:
        executionMode: executable
        target: requests/summarize and llm req
        steps:
        - Arrange summarize assets with path/content file metadata and oneOf.
        - Invoke --p-path, --p-content, neither, and both cases with an injected provider.
        - Assert files, prompt XML, raw/full output, and zero calls for invalid cardinality.
        command: npm test -- --test-name-pattern=WI-0024-10000000_TC-SUMMARIZE-EXAMPLE
      expectedOutcome: Summarize works through the generic request pathway with no request-name file branch.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: cli-audit
      fixtureRefs: []
      limitations: [No authenticated provider call is in scope.]
