        - Run focused request, summarize, parameter, prompt, and projection tests.
        - Run the full typecheck, test, build, and diff-check gate.
        - Inspect changed paths against non-goals and contract references.
        command: npm run typecheck && npm test && npm run build && git diff --check
      expectedOutcome: All compatibility and package gates pass without provider or production claims.
      passCriteria: The full gate exits zero and changed paths remain in scope.
      evidenceTier: cli-audit
      fixtureRefs: []
      limitations: [The package gate is local and provider-free.]
