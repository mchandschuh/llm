        - REF-004
        - REF-005
        - REF-006
      basis: Repository inspection confirms that provider finish metadata is currently discarded and empty tool-call collections currently control termination.
      confidence: 99
    considerations:
      - id: C-001
        kind: boundary
        statement: Provider-specific finish_reason must be translated at the provider adapter boundary.
        evaluation: Add a provider-neutral decision to ProviderCompletionResponse and keep finish_reason out of orchestration code.
        referenceRefs:
          - REF-001
          - REF-002
          - REF-003
        status: accepted
        impact: 100
        confidence: 99
      - id: C-002
        kind: constraint
        statement: An empty tool-call collection is not sufficient evidence of termination in automatic mode.
        evaluation: Require decision stop for terminal output and decision continue plus non-empty calls for tool execution.
        referenceRefs:
          - REF-001
          - REF-004
          - REF-005
        status: accepted
        impact: 100
        confidence: 99
      - id: C-003
        kind: risk
        statement: Missing or contradictory termination metadata could cause an unbounded or incorrect tool loop.
        evaluation: Reject missing/unknown decisions and contradictory decision/call combinations before output or invocation handling.
        referenceRefs:
          - REF-001
          - REF-003
          - REF-004
        status: accepted
        impact: 100
        confidence: 98
