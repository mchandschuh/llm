  intent:
    summary: Define the provider-neutral termination decision and provider-specific finish_reason mapping for bounded v2 tool orchestration.
    objectives:
      - Add an explicit continue-or-stop decision to ProviderCompletionResponse.
      - Map OpenRouter choices[0].finish_reason values at the provider adapter boundary.
      - Make automatic orchestration fail closed for missing, unknown, empty-continue, and stop-with-tools responses.
      - Document the intermediate provider decision without changing terminal response/v2 or v1 contracts.
    inScope:
      - ProviderCompletionResponse and LlmProviderV2 behavior.
      - OpenRouter Chat Completions finish_reason parsing and normalization.
      - completeV2 automatic loop control and deterministic mocked-provider tests.
      - SKILL.md provider and tool-loop documentation.
    outOfScope:
      - request/v1, response/v1, and terminal response/v2 schema mutation.
      - Streaming, other live providers, new model envelopes, and terminal control tools.
      - Authenticated provider calls, production deployment, and real tool side effects.
    policy:
      id: component-design
      version: "1"
    profile: implementable
    scope: component
    facets:
