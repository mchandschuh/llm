    testCases:
    - id: WI-0026-10000000_TC-CLAUDE-INVOCATION
      title: Run claude with the documented invocation
      type: component
      requirementLevel: required
      purpose: Prove the provider passes the documented flags, model, effort, and system prompt, writes the prompt to stdin, returns result text, validates the executable, and fails boundedly on missing executables, non-zero exits, error envelopes, invalid JSON, aborts, and image attachments.
      procedure:
        executionMode: executable
        target: ClaudeProvider with a fake claude executable
        steps:
        - Arrange a fake claude executable that records argv and stdin and replies with configured envelopes.
        - Run completions for success and each failure mode.
        - Assert argv, stdin, content, and bounded PROVIDER_REQUEST_FAILED or CONFIGURATION_INVALID errors.
        command: npm test -- --test-name-pattern=WI-0026-10000000_TC-CLAUDE-INVOCATION
      expectedOutcome: The claude-invocation behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: component
      fixtureRefs: []
      limitations: [A fake claude executable does not establish real Claude Code, authentication, or model behavior.]
    - id: WI-0026-10000000_TC-STRUCTURED-OUTPUT
      title: Map outputSchema to --json-schema
      type: component
      requirementLevel: required
      purpose: Prove outputSchema is passed as --json-schema, structured_output becomes JSON content that satisfies the schema through complete, non-object roots are wrapped and unwrapped, and a missing structured_output fails.
      procedure:
        executionMode: executable
        target: ClaudeProvider and complete with a fake claude executable
        steps:
        - Arrange object and non-object output schemas.
        - Run provider completions and complete with the fake executable.
        - Assert the schema argument, content, and the missing-output failure.
        command: npm test -- --test-name-pattern=WI-0026-10000000_TC-STRUCTURED-OUTPUT
      expectedOutcome: The structured-output behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: component
      fixtureRefs: []
      limitations: [A fake claude executable does not establish real Claude Code, authentication, or model behavior.]
    - id: WI-0026-10000000_TC-TOOL-CALLING
      title: Call tools through structured output
      type: component
      requirementLevel: required
      purpose: Prove tool definitions and tool history reach the stdin prompt, the --json-schema constrains replies to stop/output or continue/toolCalls with each tool inputSchema, and the complete tool loop runs end to end through claude.
      procedure:
        executionMode: executable
        target: ClaudeProvider and the complete tool loop with a fake claude executable
        steps:
        - Arrange a tool-capable request and a fake executable that replies continue and then stop.
        - Run the complete tool loop with an injected tool invoker.
        - Assert the envelope schema, prompt contents for each round, tool calls, tool results, and final output.
        command: npm test -- --test-name-pattern=WI-0026-10000000_TC-TOOL-CALLING
      expectedOutcome: The tool-calling behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: component
      fixtureRefs: []
      limitations: [A fake claude executable does not establish real Claude Code, authentication, or model behavior.]
    - id: WI-0026-10000000_TC-PROVIDER-RESOLUTION
      title: Resolve providers through every mechanism
      type: component
      requirementLevel: required
      purpose: Prove request.provider, request defaults, completion settings, and llm summarize --provider resolve the registered adapter, injected providers take precedence, and unknown names fail with a configuration error listing the available providers.
      procedure:
        executionMode: executable
        target: Provider registry, complete, completeRequest, and the summarize command
        steps:
        - Arrange requests selecting claude, openrouter, and an unknown provider.
        - Run each selection mechanism with the fake executable and no OpenRouter key.
        - Assert the adapter used, the injected-provider precedence, and the unknown-provider error.
        command: npm test -- --test-name-pattern=WI-0026-10000000_TC-PROVIDER-RESOLUTION
      expectedOutcome: The provider-resolution behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: component
      fixtureRefs: []
      limitations: [A fake claude executable does not establish real Claude Code, authentication, or model behavior.]
    - id: WI-0026-10000000_TC-DEFAULT-PROVIDER
      title: Default to claude with sonnet
      type: unit
      requirementLevel: required
      purpose: Prove requests without a provider normalize to claude/sonnet, openrouter without a model keeps openai/gpt-5.6-luna, summarize defaults no longer pin openrouter, and the request schema documents the new defaults.
      procedure:
        executionMode: executable
        target: normalizeRequest, summarize defaults, and the request schema
        steps:
        - Normalize requests with and without provider and model.
        - Read the summarize defaults and the request schema.
        - Assert the defaults and documentation.
        command: npm test -- --test-name-pattern=WI-0026-10000000_TC-DEFAULT-PROVIDER
      expectedOutcome: The default-provider behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: unit
      fixtureRefs: []
      limitations: [A fake claude executable does not establish real Claude Code, authentication, or model behavior.]
    - id: WI-0026-10000000_TC-DOCUMENTATION-AND-ISOLATION
      title: Document the provider and keep tests provider-free
      type: integration
      requirementLevel: required
      purpose: Prove SKILL.md documents claude selection, defaults, flags, limitations, and the tool-calling schema mapping, and that the suite never runs the real claude CLI.
      procedure:
        executionMode: executable
        target: SKILL.md, README.md, requests/README.md, and a PATH-shimmed suite run
        steps:
        - Read the public docs.
        - Assert the required statements.
        - Record the PATH-shim run of the full suite in validation evidence.
        command: npm test -- --test-name-pattern=WI-0026-10000000_TC-DOCUMENTATION-AND-ISOLATION
      expectedOutcome: The documentation-and-isolation behavior matches the contract and fails closed at its boundary.
      passCriteria: The focused test exits zero and all assertions pass.
      evidenceTier: integration
      fixtureRefs: []
