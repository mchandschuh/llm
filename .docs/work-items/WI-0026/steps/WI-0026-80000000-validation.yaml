      name: validate-all-claude-provider-evidence
      description: Run focused tests, the full package gate, a PATH-shimmed suite run, documentation checks, and changed-path review.
      reason: Every requirement needs bounded local evidence, and no test may reach the real claude CLI.
      targetRefs: ['#target/WI-0026-80000000_TARGET-REPOSITORY', '#target/WI-0026-80000000_TARGET-IMPLEMENTATION']
      objectiveRefs:
      - WI-0026-10000000#objective/WI-0026-10000000_OBJ-001
      - WI-0026-10000000#objective/WI-0026-10000000_OBJ-002
      - WI-0026-10000000#objective/WI-0026-10000000_OBJ-003
      - WI-0026-10000000#objective/WI-0026-10000000_OBJ-004
      - WI-0026-10000000#objective/WI-0026-10000000_OBJ-005
      testCaseRefs:
      - WI-0026-10000000#test-case/WI-0026-10000000_TC-CLAUDE-INVOCATION
      - WI-0026-10000000#test-case/WI-0026-10000000_TC-STRUCTURED-OUTPUT
      - WI-0026-10000000#test-case/WI-0026-10000000_TC-TOOL-CALLING
