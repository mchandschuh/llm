      - WI-0026-10000000#test-case/WI-0026-10000000_TC-DOCUMENTATION-AND-ISOLATION
      method:
        executionMode: executable
        target: Provider-free claude provider matrix
        steps:
        - Run the focused tests and the entire repository test suite.
        - Re-run the entire suite with a fake claude first on PATH and assert it recorded zero invocations.
        - The entire repository test suite must pass before this work item is complete.
        - Run npm run typecheck, npm run build, and git diff --check.
        - Inspect the docs, changed paths, and non-goals.
        command: npm run typecheck && npm test && npm run build && git diff --check
      expected:
        outcome: passed
        exitCode: 0
        assertions:
        - All required strategy cases pass or are explicitly accounted for.
        - The PATH-shimmed suite run records zero claude invocations.
        - No authenticated provider or production claim is made.
      evidenceTier: cli-audit
      required: true
    nonGoals:
    - Apply only the WI-0026 documentation surfaces (README.md, SKILL.md, and the provider statements in requests/README.md).
    - Do not support image attachments or stream-json input, and do not change OpenRouter projection or credentials.
    - Do not invoke the real claude CLI or any authenticated provider from automated tests, and do not claim production readiness.
