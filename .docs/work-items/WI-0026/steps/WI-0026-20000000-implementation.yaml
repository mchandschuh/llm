  result:
    status: implemented
    implementation:
      summary: "Added the claude provider (Claude Code CLI via claude -p with --safe-mode, JSON output, no built-in or MCP tools, no session persistence, request on stdin) and a provider registry used by complete, completeRequest, chat, and CLI provider overrides. claude/sonnet is now the default and openrouter keeps its default model. Structured output maps to --json-schema, and tool calling uses a stop/continue envelope built from the existing tool schemas. A suite-wide guard keeps every test off the real CLI."
