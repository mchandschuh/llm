      - '#finding/WI-0026-90000000_FIND-005'
      - '#finding/WI-0026-90000000_FIND-008'
    findings:
    - id: WI-0026-90000000_FIND-001
      severity: required
      status: resolved
      message: "Embedding caller schemas (outputSchema, tool inputSchemas, wrapped non-object roots) under a new root broke their local $refs, so the emitted --json-schema could not compile."
      requestedChange: "Fixed in 65c9f21: embedded schemas move to #/$defs/<key> with local refs rewritten; $id-scoped schemas are kept as is; strict Ajv 2020 compile tests cover both."
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/claude-provider.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-002
      severity: required
      status: resolved
      message: "The tool envelope root used oneOf (and minLength/minItems), which Claude structured output may reject."
      requestedChange: "Fixed in 65c9f21: the root is a flat object (decision enum, optional output and toolCalls, anyOf call schemas), with combination rules checked on read. Acceptance by real Claude Code remains unverified (FIND-009)."
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/claude-provider.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-003
      severity: advisory
      status: resolved
      message: "No test validated the generated schemas, so findings 001 and 002 would have passed the suite."
      requestedChange: "Fixed in 65c9f21: every emitted --json-schema is compiled with strict Ajv 2020 and checked against valid and invalid sample replies."
      criterionRefs:
      - '#criterion/CRIT-001'
      affectedRefs:
      - tests/claude-provider.test.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-004
      severity: advisory
      status: waived
      message: "Removing the summarize openrouter pins changes llm summarize --provider openrouter from openai/gpt-5-nano to openai/gpt-5.6-luna."
      requestedChange: "Accepted as a consequence of the operator decision to move summarize to claude; documented in requests/README.md and requests/decisions.md with the --model openai/gpt-5-nano workaround."
      criterionRefs:
      - '#criterion/CRIT-003'
      affectedRefs:
      - requests/summarize/summarize.defaults.json
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-005
      severity: advisory
      status: resolved
      message: "Windows executable resolution ignored backslash paths and PATHEXT."
      requestedChange: "Fixed in 65c9f21 for backslash paths and PATHEXT (claude.exe). .cmd and .bat shims are documented as unsupported, so no process is spawned through a shell."
      criterionRefs:
      - '#criterion/CRIT-003'
      affectedRefs:
      - src/claude-provider.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-006
      severity: advisory
      status: resolved
      message: "A stalled claude process could hang a completion forever, and kills sent only SIGTERM."
      requestedChange: "Fixed in 65c9f21: a 10-minute default timeout (LLM_CLAUDE_TIMEOUT_MS or timeoutMs) with SIGTERM-then-SIGKILL escalation for timeouts, aborts, and output overflow."
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/claude-provider.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-007
      severity: advisory
      status: resolved
      message: "A stop envelope without output produced undefined content when an outputSchema was set."
      requestedChange: "Fixed in 65c9f21: a stop reply without output is a bounded PROVIDER_REQUEST_FAILED."
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/claude-provider.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-008
      severity: required
      status: resolved
      message: "Before the test guard existed, one local suite run started the real claude CLI from the OpenRouter transport test, which relied on the default provider."
      requestedChange: "Fixed in e35e00c: the test selects openrouter explicitly, and tests/support/claude-guard.ts (loaded by the npm test scripts) points the provider at a fake CLI; guarded runs record zero real invocations."
      criterionRefs:
      - '#criterion/CRIT-003'
      affectedRefs:
      - tests/llm.test.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    - id: WI-0026-90000000_FIND-009
      severity: advisory
      status: resolved
      message: "Acceptance of the generated --json-schema envelopes and the JSON result parsing by the real Claude Code CLI has not been verified; all evidence uses a fake CLI."
      requestedChange: "With operator approval, run one live llm summarize and one tool-calling completion through the compiled CLI and record the result. Resolved by WI-0027: the operator-approved live run found and fixed a $schema dialect defect (the CLI rejected the 2020-12 summarize outputSchema), after which npm run test:live:claude passed all four checks, including a read_file/write_file chat session (WI-0027-80000000#result/R-001)."
      criterionRefs:
      - '#criterion/CRIT-002'
      affectedRefs:
      - src/claude-provider.ts
      evidenceRefs:
      - WI-0026-80000000#result/R-001
    evidence:
    - id: EVID-001
      kind: validation
      ref: WI-0026-80000000#result/R-001
