        required: true
    objectives:
      - id: OBJ-PROMPT-COMMAND
        statement: Implement -p/--prompt as a one-shot completion path that does not touch session state.
        inputRefs: [INPUT-WORK-ITEM, INPUT-STRATEGY]
        testCaseRefs: [WI-0010|00000000#test-case/TC-PROMPT-ISOLATION]
      - id: OBJ-CHAT-COMMAND
        statement: Implement -c/--chat <prompt> as a fresh session start, subsequent bare llm <prompt> continuation, persisted history, and explicit --chat-id destination behavior without resume through -c.
        inputRefs: [INPUT-WORK-ITEM, INPUT-PERSISTENCE]
        testCaseRefs: [WI-0010|00000000#test-case/TC-CHAT-PERSISTENCE, WI-0010|00000000#test-case/TC-CHAT-ID]
      - id: OBJ-SHELL-UX
        statement: Implement the documented LLM_CHAT_ID environment handoff, actionable continuation errors, human/machine output, debug routing, and one-prompt-per-process behavior without TTY or stdin requirements.
        inputRefs: [INPUT-WORK-ITEM, INPUT-STRATEGY]
        testCaseRefs: [WI-0010|00000000#test-case/TC-SHELL-HANDOFF, WI-0010|00000000#test-case/TC-COMPATIBILITY]
      - id: OBJ-COMPATIBILITY
        statement: Preserve positional request-file, --config, --help, --version, --debug, and stable exit-code behavior.
        inputRefs: [INPUT-WORK-ITEM, INPUT-STRATEGY]
        testCaseRefs: [WI-0010|00000000#test-case/TC-COMPATIBILITY]
    ownedPaths: [src/cli/, src/cli.ts, tests/cli.test.ts, README.md, SKILL.md, samples/]
    nonGoals:
      - Do not allow -p/--prompt to create, read, mutate, resume, or depend on chat-session state.
      - Do not add arbitrary shell tools, provider credentials, remote conversation storage, or production deployment.
      - Do not claim a child process mutates its parent shell environment; document and test the explicit handoff mechanism.
      - Do not add chat persistence outside /tmp/.llm/chat/.
      - Do not implement a REPL, interactive chat loop, long-lived process, TTY/readline requirement, stdin-driven message loop, slash-command exit interface, or promptless implicit chat start.
      - Do not make -c resume an existing session; every -c invocation starts a new session, and --chat-id only selects the new session's persistence ID.
    steps:
      - Read the required nodejs-cli-pattern skill and all completed task results.
      - Add mutually exclusive mode parsing and preserve existing positional/config behavior.
      - Implement prompt output and optional JSON response output.
      - Implement chat startup with a required prompt, explicit subsequent bare-prompt continuation routing, --chat-id fresh-session destination selection, and state persistence integration.
      - Update help, README, SKILL, and samples without overstating environment behavior.
      - Add command-process tests for all modes, persistence routing, output streams, and exit codes.
      - Run typecheck/tests/build and record evidence.
