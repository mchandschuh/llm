  intent:
    summary: Implement local persisted chat-session state and safe rehydration without changing the provider-neutral LlmChatSession contract.
    changeTypes: [production-code, test-code, documentation]
    changeIntent: feature
    inputs:
      - id: INPUT-WORK-ITEM
        kind: requirement
        ref: WI-0010|00000000#work-item/WI-0010
        purpose: Persistence, chat-id, environment, security, and prompt-isolation requirements.
        required: true
      - id: INPUT-STRATEGY
        kind: testStrategy
        ref: WI-0010|00000000#result/R-001
        purpose: Persistence and security test cases.
        required: true
      - id: INPUT-CLI-REFACTOR
        kind: implementation
        ref: WI-0010|10000000#result/R-001
        purpose: Refactored CLI mode boundaries and public library seams.
        required: true
    objectives:
      - id: OBJ-STORE
        statement: Persist fresh -c session state and rehydrate it only for subsequent bare llm <prompt> invocations under /tmp/.llm/chat/{chat-id}.json using validated schemas, atomic replacement, restrictive permissions, and bounded content.
        inputRefs: [INPUT-WORK-ITEM, INPUT-STRATEGY]
        testCaseRefs: [WI-0010|00000000#test-case/TC-CHAT-PERSISTENCE, WI-0010|00000000#test-case/TC-SECURITY-SCOPE]
      - id: OBJ-ID
        statement: Resolve explicit and ambient chat identifiers safely and reject unsafe identifiers before filesystem access.
        inputRefs: [INPUT-WORK-ITEM, INPUT-STRATEGY]
        testCaseRefs: [WI-0010|00000000#test-case/TC-CHAT-ID]
      - id: OBJ-HANDOFF
        statement: Define the explicit LLM_CHAT_ID shell handoff/export contract and actionable missing-handoff behavior without claiming parent-shell mutation.
        inputRefs: [INPUT-WORK-ITEM, INPUT-STRATEGY]
        testCaseRefs: [WI-0010|00000000#test-case/TC-SHELL-HANDOFF]
      - id: OBJ-PROMPT-BOUNDARY
        statement: Keep persistence APIs unreachable from prompt-only execution paths.
        inputRefs: [INPUT-WORK-ITEM, INPUT-STRATEGY]
        testCaseRefs: [WI-0010|00000000#test-case/TC-PROMPT-ISOLATION]
    ownedPaths: [src/cli/, src/chat-session-store.ts, src/types.ts, tests/cli-session-store.test.ts, tests/chat.test.ts, README.md, SKILL.md]
    nonGoals:
      - Do not add prompt-mode persistence or any -p/--prompt session access.
      - Do not add remote storage, database state, provider conversation IDs, or credentials to persisted JSON.
      - Do not add arbitrary command execution, shell text execution, or unbounded file reads.
      - Do not add a REPL, interactive chat loop, TTY/readline requirement, stdin-driven message loop, slash-command interface, or long-lived process.
      - Do not make -c resume an existing session; every -c invocation starts fresh, and --chat-id only names the new session's persistence destination.
      - Do not make -c without a prompt wait for input; chat start requires one prompt argument.
    steps:
      - Read the required CLI pattern skill and completed strategy/refactor results.
      - Define a closed persisted-state shape derived from provider-neutral session history.
      - Validate and sanitize chat IDs before path resolution; enforce approved root containment.
      - Implement atomic writes and restrictive file permissions with provider/debug secret exclusion.
      - Implement explicit environment/export handoff primitives and missing-handoff errors.
      - Add deterministic persistence, corruption, traversal, secret-exclusion, and prompt-isolation tests.
      - Run typecheck/tests and record evidence.
  result:
