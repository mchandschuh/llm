        inputRefs: [INPUT-CLI-PATTERN, INPUT-CURRENT-CLI]
        testCaseRefs: [WI-0010|00000000#test-case/TC-CLI-ARCHITECTURE]
      - id: OBJ-COMPATIBILITY
        statement: Preserve positional request-file, --config, --help, --version, --debug, JSON output, error output, and exit-code behavior.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CURRENT-CLI]
        testCaseRefs: [WI-0010|00000000#test-case/TC-COMPATIBILITY]
      - id: OBJ-BOUNDARY
        statement: Establish reusable public-mode seams so later prompt and chat tasks call complete/chatFactory without duplicating provider or session behavior.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CLI-PATTERN]
        testCaseRefs: [WI-0010|00000000#test-case/TC-CLI-ARCHITECTURE]
    ownedPaths: [src/cli.ts, src/cli/, tests/cli.test.ts, tests/llm.test.ts, README.md, SKILL.md]
    nonGoals:
      - Do not add -p/--prompt, -c/--chat, --chat-id, persistence, environment handoff, or new chat state in this refactor task.
      - Do not change complete/chatFactory/provider behavior or add dependencies.
      - Do not read or write credentials, .env files, arbitrary executable paths, or session files.
      - Do not silently claim that the refactor supports parent-shell environment mutation.
    steps:
      - Read the required skill at /home/michael/.cline/skills/nodejs-cli-pattern/SKILL.md before editing.
      - Inventory current CLI behavior and write compatibility tests before moving code.
      - Extract argument/help/output/mode boundaries using native ESM and explicit .js imports.
      - Keep src/cli.ts thin and delegate to public library boundaries.
      - Run typecheck, tests, build, CLI help/version/config smoke tests, and declaration inspection.
      - Record changes, evidence, and limitations in the result.
