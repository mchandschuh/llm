task:
  status: planned
  taskSchema: https://schemas.handschuh.dev/sdlc/task-test-strategy/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-test-strategy/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-test-strategy/v1#/properties/result
  intent:
    summary: Define complete deterministic evidence for nodejs-cli-pattern refactoring, one-shot prompt isolation, persistent chat rehydration, explicit chat-id behavior, shell handoff, safety, compatibility, and repository gates.
    inputs:
      - id: INPUT-WORK-ITEM
        kind: requirement
        ref: WI-0010|00000000#work-item/WI-0010
        purpose: Authoritative scope, requirements, acceptance criteria, and non-goals.
        required: true
      - id: INPUT-CLI-PATTERN
        kind: artifact
        ref: "#artifact/nodejs-cli-pattern"
        purpose: Required command architecture, native ESM, thin adapter, and testing guidance.
        required: true
      - id: INPUT-CURRENT-CLI
        kind: artifact
        ref: "#artifact/current-cli"
        purpose: Current CLI behavior and compatibility boundary.
        required: true
    requirements:
      - id: REQ-001
        kind: requirement
        statement: Cover WI-0010_REQ_001 and both acceptance criteria for the nodejs-cli-pattern refactor and preservation of current CLI behavior.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CLI-PATTERN, INPUT-CURRENT-CLI]
        required: true
      - id: REQ-002
        kind: requirement
        statement: Cover WI-0010_REQ_002 and both acceptance criteria proving -p/--prompt is one-shot and session-state isolated.
        inputRefs: [INPUT-WORK-ITEM]
        required: true
      - id: REQ-003
        kind: requirement
        statement: Cover WI-0010_REQ_003 and all persistence, rehydration, atomicity, permissions, and state-sanitization criteria.
        inputRefs: [INPUT-WORK-ITEM]
        required: true
      - id: REQ-004
        kind: requirement
        statement: Cover WI-0010_REQ_004 and fresh-session chat-id selection/validation behavior without resume through -c.
        inputRefs: [INPUT-WORK-ITEM]
        required: true
      - id: REQ-005
        kind: requirement
        statement: Cover WI-0010_REQ_005 and the shell handoff/parent-environment limitation.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CLI-PATTERN]
        required: true
      - id: REQ-006
        kind: requirement
        statement: Cover WI-0010_REQ_006 for backward compatibility, output routing, one-prompt-per-process behavior, and exit codes.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CURRENT-CLI]
        required: true
      - id: REQ-007
        kind: requirement
        statement: Cover WI-0010_REQ_007 for conventions, gates, automated review coverage, and changed-path evidence.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CLI-PATTERN]
        required: true
    invariants:
      - id: INV-001
        statement: Prompt mode is strictly stateless and never reads, writes, mutates, resumes, or depends on chat-session persistence or LLM_CHAT_ID.
        inputRefs: [INPUT-WORK-ITEM]
        required: true
      - id: INV-002
        statement: Chat mode is the only mode that owns persisted session state; every -c invocation starts fresh, and subsequent bare llm <prompt> invocations alone rehydrate validated provider-neutral LlmChatSession data.
        inputRefs: [INPUT-WORK-ITEM]
        required: true
      - id: INV-003
        statement: A plain child process cannot mutate its parent shell environment; supported continuation requires an explicit LLM_CHAT_ID shell handoff/export and a subsequent bare llm <prompt> process.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CLI-PATTERN]
        required: true
      - id: INV-004
        statement: Chat-session identifiers are safe single path components and cannot cause traversal, absolute-path access, or writes outside /tmp/.llm/chat/.
        inputRefs: [INPUT-WORK-ITEM]
        required: true
      - id: INV-005
        statement: Existing request-file/config/help/version/debug behavior remains compatible while new modes use the same public completion/session library boundaries.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CURRENT-CLI]
        required: true
      - id: INV-006
        statement: No credentials, raw provider diagnostics, arbitrary executable content, persistence beyond the approved directory, or remote conversation identifier is stored in chat JSON.
        inputRefs: [INPUT-WORK-ITEM]
        required: true
    objectives:
      - id: OBJ-ARCHITECTURE
        statement: Verify the CLI is split into nodejs-cli-pattern argument, mode, output, and entrypoint boundaries.
        inputRefs: [INPUT-CLI-PATTERN, INPUT-CURRENT-CLI]
        requirementRefs: [REQ-001, REQ-007]
        invariantRefs: [INV-005]
      - id: OBJ-PROMPT
        statement: Verify one-shot prompt mode and its strict isolation from chat state.
        inputRefs: [INPUT-WORK-ITEM]
        requirementRefs: [REQ-002]
        invariantRefs: [INV-001, INV-005]
      - id: OBJ-PERSISTENCE
        statement: Verify fresh chat starts, subsequent-process rehydration, explicit chat IDs, safe filesystem behavior, and secret exclusion.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CURRENT-CLI]
        requirementRefs: [REQ-003, REQ-004]
        invariantRefs: [INV-002, INV-004, INV-006]
      - id: OBJ-ENVIRONMENT
        statement: Verify the documented shell handoff and actionable continuation failure without parent-environment mutation claims.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CLI-PATTERN]
        requirementRefs: [REQ-005]
        invariantRefs: [INV-003]
      - id: OBJ-COMPATIBILITY
        statement: Verify existing CLI modes, output routing, exit codes, one-prompt-per-process behavior, and no regressions.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CURRENT-CLI]
        requirementRefs: [REQ-006]
        invariantRefs: [INV-005]
      - id: OBJ-GATES
        statement: Verify complete package gates, generated declarations, scope, security scans, and review coverage.
        inputRefs: [INPUT-WORK-ITEM, INPUT-CLI-PATTERN]
        requirementRefs: [REQ-007]
        invariantRefs: [INV-001, INV-002, INV-004, INV-006]
    nonGoals:
      - Do not use live providers or real external tools.
      - Do not persist state for -p/--prompt.
      - Do not implement remote/server-side conversation storage or rely on OpenRouter conversation IDs.
      - Do not implement arbitrary shell command execution or credential persistence.
      - Do not claim a child process can mutate its parent shell environment.
      - Do not implement a REPL, interactive chat loop, long-lived process, TTY/readline requirement, stdin-driven message loop, slash-command exit interface, or promptless implicit chat start.
      - Do not make -c resume an existing session; every -c invocation starts fresh, and --chat-id only names the new session's persistence destination.
      - Do not treat EOF, Ctrl-C, or signal handling as a chat UX requirement; each supported invocation receives one prompt argument and exits.
  result:
    status: defined
    testCases:
      - id: TC-CLI-ARCHITECTURE
        title: CLI follows nodejs-cli-pattern module boundaries
        type: inspection
        requirementLevel: required
        purpose: Prove REQ-001 and OBJ-ARCHITECTURE.
        procedure:
          executionMode: executable
          target: src/cli.ts and CLI modules
          steps: [Inspect imports and module boundaries, verify thin entrypoint behavior, verify explicit .js ESM imports, and run compatibility command tests.]
          command: npm test
        expectedOutcome: CLI parsing, modes, output, and execution are separated according to the required skill.
        passCriteria: Architecture audit and compatibility tests pass.
        evidenceTier: inspection
        fixtureRefs: [FIX-CLI]
        limitations: [Local source and provider-free evidence only.]
      - id: TC-PROMPT-ISOLATION
        title: one-shot prompt mode is stateless
        type: component
        requirementLevel: required
        purpose: Prove REQ-002 and INV-001.
        procedure:
          executionMode: executable
          target: -p/--prompt command
          steps: [Run prompt mode with an existing session file and LLM_CHAT_ID, capture filesystem and environment effects, and verify one completion only.]
          command: npm test
        expectedOutcome: Prompt mode returns one result and does not read, write, or mutate chat state.
        passCriteria: No chat-session filesystem access or environment mutation occurs.
        evidenceTier: component
        fixtureRefs: [FIX-PROMPT, FIX-SESSION]
        limitations: [Provider-free evidence only.]
      - id: TC-CHAT-PERSISTENCE
        title: chat start persists and later bare prompts rehydrate validated session history
        type: integration
        requirementLevel: required
        purpose: Prove REQ-003 and INV-002.
        procedure:
          executionMode: executable
          target: chat mode and local session store
          steps: [Start a fresh chat with -c <prompt>, persist state and the LLM_CHAT_ID handoff, launch a subsequent bare llm <prompt> process, verify complete history, corrupt state, and assert actionable failure.]
          command: npm test
        expectedOutcome: Valid session JSON rehydrates and invalid state is rejected without partial mutation.
        passCriteria: Atomic writes, restrictive permissions, bounded schema, and complete history assertions pass.
        evidenceTier: integration
        fixtureRefs: [FIX-SESSION]
        limitations: [Local filesystem evidence only.]
      - id: TC-CHAT-ID
        title: explicit chat-id creates fresh sessions and rejects unsafe identifiers
        type: component
        requirementLevel: required
        purpose: Prove REQ-004 and INV-004.
        procedure:
          executionMode: executable
          target: --chat-id argument and session path resolver
          steps: [Start a new session with an explicit ID, verify existing state is not rehydrated by -c, and reject traversal, separators, control characters, oversized IDs, and outside-directory paths.]
        expectedOutcome: Explicit identifiers select only safe approved session paths for fresh -c sessions.
        passCriteria: Fresh-create/no-resume/reject cases pass without outside writes.
        evidenceTier: component
        fixtureRefs: [FIX-SESSION]
        limitations: [Local filesystem evidence only.]
      - id: TC-SHELL-HANDOFF
        title: environment continuation contract is honest and actionable
        type: cli
        requirementLevel: required
        purpose: Prove REQ-005 and INV-003.
        procedure:
          executionMode: executable
          target: help, shell integration/export, and continuation errors
          steps: [Inspect help, execute the supported handoff mechanism, continue with LLM_CHAT_ID, and verify missing-handoff guidance.]
          command: npm test
        expectedOutcome: The documented mechanism works and no test claims child-process parent mutation.
        passCriteria: Handoff and actionable error assertions pass.
        evidenceTier: cli-audit
        fixtureRefs: [FIX-CLI]
        limitations: [Shell behavior is tested through controlled child-process fixtures.]
      - id: TC-COMPATIBILITY
        title: existing config CLI and process controls remain compatible
        type: integration
        requirementLevel: required
        purpose: Prove REQ-006 and INV-005.
        procedure:
          executionMode: executable
          target: existing request-file/config/help/version/debug paths and new modes
          steps: [Run legacy and new one-prompt invocations, verify stdout/stderr separation, JSON output, exit codes, and non-TTY operation.]
          command: npm test
        expectedOutcome: Existing behavior remains compatible and new command modes have stable process behavior.
        passCriteria: All command matrix cases pass.
        evidenceTier: integration
        fixtureRefs: [FIX-CLI]
        limitations: [No authenticated provider call.]
      - id: TC-SECURITY-SCOPE
        title: persistence and source scope contain no secrets or arbitrary execution
        type: inspection
        requirementLevel: required
        purpose: Prove REQ-003/007 and INV-004/006.
        procedure:
          executionMode: executable
          target: session serializer, CLI modules, docs, and changed paths
          steps: [Scan persisted schema and implementation for credentials, provider raw errors, executable fields, unsafe paths, forbidden prompt persistence, and unapproved files.]
          command: npm test
        expectedOutcome: Session JSON and CLI scope remain bounded and safe.
        passCriteria: Negative security/scope scans pass.
        evidenceTier: inspection
        fixtureRefs: [FIX-SESSION]
        limitations: [Static/local evidence only.]
      - id: TC-PACKAGE-GATES
        title: package, declarations, and full review coverage gates pass
        type: cli
        requirementLevel: required
        purpose: Prove REQ-007 and all implementation obligations.
        procedure:
          executionMode: executable
          target: repository package and WI-0010 task graph
          steps: [Run typecheck, tests, build, generated declaration inspection, coverage audit, diff check, conflict scan, and changed-path review.]
          command: npm run typecheck && npm test && npm run build
        expectedOutcome: All gates pass with no unreviewed paths or uncovered requirements.
        passCriteria: Commands exit zero and automated coverage audit passes.
        evidenceTier: cli-audit
        fixtureRefs: [FIX-CLI]
        limitations: [Provider-free local evidence only.]
    fixtures:
      - id: FIX-CLI
        name: cli-process-fixtures
        purpose: Isolated child-process invocations for legacy, prompt, fresh-chat, continuation, handoff, output, non-TTY, and exit-code cases.
        setup: Build dist and use temporary HOME/session roots where supported.
        teardown: Remove only test-owned temporary files.
        sourceRefs: ["#artifact/current-cli", "#artifact/nodejs-cli-pattern"]
      - id: FIX-SESSION
        name: persisted-chat-session-fixtures
        purpose: Valid, corrupt, unsafe, secret-bearing, and incompatible local session JSON cases.
        setup: Use a test-owned temporary session directory and deterministic injected provider.
        teardown: Remove only test-owned temporary files.
        sourceRefs: ["#artifact/session-contract"]
      - id: FIX-PROMPT
        name: stateless-prompt-fixtures
        purpose: Existing session and LLM_CHAT_ID state proving -p isolation.
        setup: Create a sentinel session and controlled environment.
        teardown: Restore environment and remove only test-owned files.
        sourceRefs: ["#artifact/session-contract"]
    coverage:
      - id: COV-CLI
        requirementRefs: [REQ-001, REQ-006, REQ-007]
        invariantRefs: [INV-005]
        objectiveRefs: [OBJ-ARCHITECTURE, OBJ-COMPATIBILITY, OBJ-GATES]
        testCaseRefs: [TC-CLI-ARCHITECTURE, TC-COMPATIBILITY, TC-PACKAGE-GATES]
        rationale: Architecture and command matrix tests preserve existing CLI behavior while adding explicit new modes.
      - id: COV-PROMPT
        requirementRefs: [REQ-002]
        invariantRefs: [INV-001]
        objectiveRefs: [OBJ-PROMPT]
        testCaseRefs: [TC-PROMPT-ISOLATION]
        rationale: Prompt-specific filesystem/environment assertions prevent accidental session coupling.
      - id: COV-SESSION
        requirementRefs: [REQ-003, REQ-004]
        invariantRefs: [INV-002, INV-004, INV-006]
        objectiveRefs: [OBJ-PERSISTENCE]
        testCaseRefs: [TC-CHAT-PERSISTENCE, TC-CHAT-ID, TC-SECURITY-SCOPE]
        rationale: Persistence, rehydration, identifier validation, and secret exclusion are tested together.
      - id: COV-ENVIRONMENT
        requirementRefs: [REQ-005]
        invariantRefs: [INV-003]
        objectiveRefs: [OBJ-ENVIRONMENT]
        testCaseRefs: [TC-SHELL-HANDOFF]
        rationale: Shell handoff and child-process limitations are executable requirements.
      - id: COV-GATES
        requirementRefs: [REQ-007]
        invariantRefs: [INV-001, INV-002, INV-004, INV-006]
        objectiveRefs: [OBJ-GATES]
        testCaseRefs: [TC-SECURITY-SCOPE, TC-PACKAGE-GATES]
        rationale: Review audit and package gates prevent uncovered or out-of-scope delivery.
    minimumRequiredTestCaseRefs: [TC-CLI-ARCHITECTURE, TC-PROMPT-ISOLATION, TC-CHAT-PERSISTENCE, TC-CHAT-ID, TC-SHELL-HANDOFF, TC-COMPATIBILITY, TC-SECURITY-SCOPE, TC-PACKAGE-GATES]
    recommendedTestCaseRefs: []
    evidenceLimitations:
      - Strategy evidence is provider-free and does not establish authenticated provider behavior, production shell installation, or deployment.
      - Prompt mode has no session persistence by design.
      - Parent-shell environment mutation must be represented by an explicit shell integration/handoff mechanism, not a child-process claim.