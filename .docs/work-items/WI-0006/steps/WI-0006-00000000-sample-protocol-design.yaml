    provenance:
      referenceRefs: [REF-001, REF-002, REF-003, REF-004, REF-005, REF-006, REF-007, REF-008]
      basis: Repository feature inspection identified a broad public CLI/library surface with no executable sample directory or discovery harness.
      confidence: 98
    considerations:
      - id: C-001
        kind: constraint
        statement: Samples must emit exactly one bounded JSON result to stdout and keep diagnostics off stdout.
        evaluation: The integration harness will reject nonzero exits, empty output, invalid JSON, and extra stdout lines.
        referenceRefs: [REF-001, REF-007]
        status: accepted
        impact: 100
        confidence: 99
      - id: C-002
        kind: boundary
        statement: Samples must not require network credentials or create real external side effects.
        evaluation: Use injected providers, mocked fetch, in-memory tools, temporary fixtures, and CLI help/version only.
        referenceRefs: [REF-001, REF-003, REF-004, REF-005]
        status: accepted
        impact: 100
        confidence: 99
      - id: C-003
        kind: constraint
        statement: The integration test must discover samples dynamically rather than duplicate a manual list.
        evaluation: Read samples/*.mjs at runtime, sort the files, and execute every discovered sample.
        referenceRefs: [REF-001, REF-007]
        status: accepted
        impact: 95
        confidence: 98
    activities:
      - id: ACT-001
