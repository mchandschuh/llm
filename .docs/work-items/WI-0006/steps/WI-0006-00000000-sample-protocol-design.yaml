  intent:
    summary: Define a deterministic executable sample protocol and discovery-based integration harness for the repository feature surface.
    objectives:
      - Define one JSON stdout result envelope and failure/diagnostic rules for every sample.
      - Allocate samples across CLI, v1/v2 library, tools/results, provider mapping, observability, cancellation, and unified-provider features.
      - Define tests/samples.test.ts discovery, child-process execution, and stable result assertions.
      - Preserve provider-free, no-side-effect, v1-compatible, and no-LangGraph boundaries.
    inScope:
      - samples/*.mjs output and execution contract.
      - Dynamic sample discovery and child-process integration assertions.
      - Provider-free fixtures, mocked fetch, in-memory tools, temporary bounded files, and CLI help/version paths.
      - Documentation expectations for executable examples.
    outOfScope:
      - Live providers, credentials, real external tools, persistence, LangGraph, deployment, and unrelated request-schema edits.
