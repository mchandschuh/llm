    limitations:
      - The loader compiles each request schema standalone, so references to other schema files are rejected in every directory before resolution; scoping schemaRoots to the owning directory is proven for local `$defs` references and a same-`$id` schema elsewhere, not for cross-file references.
      - When locating a request across several directories, a child directory or symlink counts as a match even if its bundle is broken; a regular file with the request's name is not a request and is ignored there, as in the listing.
      - With one configured directory an unknown request keeps the loader's existing message; with several, the message names the searched directories.
